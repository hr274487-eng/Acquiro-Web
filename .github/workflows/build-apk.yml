name: Build Acquiro Manager React Native APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build React Native Android APK (Android 9+)
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Accept Licenses & Install Android SDK 34
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install React Native Dependencies
        run: |
          cd mobile-app
          npm install --legacy-peer-deps

      - name: Bundle React Native JS & Assets
        run: |
          cd mobile-app
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Make Gradlew Executable
        run: chmod +x mobile-app/android/gradlew

      - name: Build Android Debug APK
        run: |
          cd mobile-app/android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Prepare Output APK
        run: |
          mkdir -p output-apk
          cp mobile-app/android/app/build/outputs/apk/debug/app-debug.apk output-apk/Acquiro-Manager-ReactNative-v1.0.apk
          echo "=== APK Successfully Built ==="
          ls -lh output-apk/Acquiro-Manager-ReactNative-v1.0.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Acquiro-Manager-ReactNative-v1.0-APK
          path: output-apk/Acquiro-Manager-ReactNative-v1.0.apk
          retention-days: 90

      - name: Create GitHub Release with React Native APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.0.0-reactnative-apk
          name: "Acquiro Manager v2.0.0 (React Native Android 9+)"
          body: |
            ### 📱 Acquiro Mobile Manager - React Native Edition (Android 9+)
            **Version:** 2.0.0 (Pure React Native)
            **Target OS:** Android 9.0+ (API Level 28 to 34)
            **Package:** `com.acquiro.manager`
            
            #### 🌟 Highlights & Features:
            - **Pure React Native Core:** Native Android performance with zero WebView lag.
            - **No Blank Fields (Resolved):** Full bidirectional schema adapter (`customer_name`, `customer_email`, `customer_phone`, `company_name`, `service_type`, `order_details`) displaying live Supabase data cleanly.
            - **True Android Heads-Up Notifications:** High-priority Android System Notification Channel (`IMPORTANCE_HIGH`), banner preview, and rhythmic haptic vibration.
            - **Custom Modern Tech Ping Sound:** Embedded 16-bit PCM 44.1kHz audio chime (`res/raw/tech_ping.wav`) playing on order arrival.
            - **Optimized Manager UI/UX:** Compact order list cards, client initials avatar, balanced 14px icons, status badges, and 1-tap dialer/email compose.
            - **Customer Directory & Export:** Deduplicated client directory with 1-tap export to **Excel (`.xlsx`)** and **CSV (`.csv`)**.
            - **Full Settings Suite:** Dark & Light theme toggle, notification toggles, sound tone preview, live Supabase endpoint tester, and password manager.
            
            #### 🔑 Default Manager Credentials:
            - **Username:** `admin`
            - **Password:** `acquiro2026`
            
            #### 📥 Download & Install:
            1. Download `Acquiro-Manager-ReactNative-v1.0.apk` below directly onto your Android device.
            2. Tap the file to install (allow *Install from Unknown Sources* if prompted).
            3. Log in with `admin` / `acquiro2026` to begin receiving live orders.
          files: output-apk/Acquiro-Manager-ReactNative-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
