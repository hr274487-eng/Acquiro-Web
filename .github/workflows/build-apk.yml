name: Build Acquiro Manager React Native APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build React Native Android APK (Android 9+)
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK 34 & Build Tools
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" || true

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v \
            -keystore mobile-app/android/app/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Install React Native Dependencies
        run: |
          cd mobile-app
          npm install --legacy-peer-deps

      - name: Bundle React Native JS & Assets
        run: |
          cd mobile-app
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Make Gradlew Executable
        run: chmod +x mobile-app/android/gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Debug APK
        run: |
          cd mobile-app/android
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info 2>&1 | tail -200

      - name: Locate and Prepare Output APK
        run: |
          echo "=== Listing all built APKs ==="
          find mobile-app/android/app/build/outputs -name "*.apk" -type f 2>/dev/null || true
          mkdir -p output-apk
          APK_PATH=$(find mobile-app/android/app/build/outputs -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found — listing build dir:"
            find mobile-app/android/app/build -type f 2>/dev/null | head -30 || true
            exit 1
          fi
          cp "$APK_PATH" output-apk/Acquiro-Manager-ReactNative-v1.0.apk
          echo "=== APK Built Successfully ==="
          ls -lh output-apk/Acquiro-Manager-ReactNative-v1.0.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Acquiro-Manager-ReactNative-v1.0-APK
          path: output-apk/Acquiro-Manager-ReactNative-v1.0.apk
          retention-days: 90

      - name: Create GitHub Release with React Native APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-reactnative-apk
          name: "Acquiro Manager v2.0.0 (React Native Android 9+)"
          body: |
            ### 📱 Acquiro Mobile Manager — React Native Edition

            **Version:** 2.0.0 | **Framework:** Pure React Native | **Target:** Android 9.0+ (API 28+)

            #### 🌟 Features
            - **Live Order Reception** — polls Supabase every 8s, detects new orders instantly
            - **True Android Heads-Up Notifications** — system banner + haptic vibration when an order arrives (even in background)
            - **Modern Tech Ping** — custom embedded sound tone plays on order arrival
            - **Compact List UI** — client cards with initials avatar, status badges, 14px icons
            - **1-tap Actions** — call, email, accept, add notes from the order card
            - **Category Filters & Search** — filter by status, search by name/phone/email/ref
            - **Customer Directory** — deduplicated client list with order frequency
            - **Export** — 1-tap export to Excel (`.xlsx`) or CSV (`.csv`)
            - **Settings** — Dark/Light theme, notification toggles, sound preview, DB tester, password manager

            #### 🔑 Default Credentials
            - **Username:** `admin`
            - **Password:** `acquiro2026`

            #### 📥 Install
            1. Download `Acquiro-Manager-ReactNative-v1.0.apk` below
            2. Tap to install (enable *Unknown Sources* if prompted)
            3. Log in and start receiving orders live
          files: output-apk/Acquiro-Manager-ReactNative-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
