name: Build Acquiro Manager React Native APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build React Native Android APK (Android 5+)
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK 34 & Build Tools
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" || true

      - name: Setup Permanent Keystore
        run: |
          if [ -f mobile-app/android/app/acquiro.keystore ]; then
            echo "Using existing permanent acquiro.keystore"
          else
            echo "Generating permanent acquiro.keystore"
            keytool -genkey -v \
              -keystore mobile-app/android/app/acquiro.keystore \
              -alias acquirokey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass acquiro2026 \
              -keypass acquiro2026 \
              -dname "CN=Acquiro Manager,O=Acquiro,C=US"
          fi
          # Always copy as debug.keystore so build.gradle can use a fixed path
          cp mobile-app/android/app/acquiro.keystore mobile-app/android/app/debug.keystore

      - name: Install React Native Dependencies
        run: |
          cd mobile-app
          npm install --legacy-peer-deps

      - name: Bundle React Native JS & Assets
        run: |
          cd mobile-app
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Make Gradlew Executable
        run: chmod +x mobile-app/android/gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Release APK
        run: |
          cd mobile-app/android
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Save Error Log to Branch on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-log
          cp mobile-app/android/gradle-build.log build-error.txt || true
          git add build-error.txt
          git commit -m "ci: android build error log" || true
          git push -u origin debug-log --force || true

      - name: Locate and Prepare Output APK
        run: |
          mkdir -p output-apk
          echo "=== Searching for all APKs in workspace ==="
          find mobile-app/android/app/build/outputs -name "*.apk" -type f || find . -name "*.apk" -type f
          APK_PATH=$(find mobile-app/android/app/build/outputs -name "*release*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find mobile-app/android/app/build/outputs -name "*.apk" -type f | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" -type f | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found anywhere in workspace"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" output-apk/Acquiro-Manager-v2.9.0.apk
          echo "=== APK Ready ==="
          ls -lh output-apk/Acquiro-Manager-v2.9.0.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Acquiro-Manager-v2.9.0-APK
          path: output-apk/Acquiro-Manager-v2.9.0.apk
          retention-days: 90

      - name: Create GitHub Release with React Native APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.9.0-apk
          name: "Acquiro Manager v2.9.0 (Android 5+ Fixed â€” True Universal Install)"
          body: |
            ### 📱 Acquiro Mobile Manager — React Native v2.9.0

            **Version:** 2.9.0
            **Target Compatibility:** Android 5.0 (API 21) through Android 14+ (API 34/35)
            **Branding:** Official Acquiro Company Geometric "A" Logo
            **Architecture:** `arm64-v8a`, `armeabi-v7a`, `x86`, `x86_64`

            #### 🛠️ What's Fixed in v2.9.0 (True Android 9 Install Fix):
            1. **Root cause found & fixed — `.so` files DEFLATED despite `useLegacyPackaging=true`:** AGP 8.3 was silently ignoring the `packaging {}` DSL setting because `android:extractNativeLibs="true"` in the manifest conflicted with it, causing AGP to fall back to its default behavior. Fixed by removing `extractNativeLibs` from the manifest entirely and letting Gradle DSL alone control it.
            2. **Lowered `minSdkVersion` from 24 → 21:** AGP 8.3 auto-applies `useLegacyPackaging=false` when `minSdkVersion >= 23`, silently overriding our Gradle DSL. Setting to 21 forces AGP to respect `useLegacyPackaging=true` and store `.so` files in the correct STORED format Android 9 can handle.
            3. **All features from previous versions preserved:** Persistent login, background order notifications, Acquiro "A" logo, filter chip layout, no in-app notification banners.

            #### 📥 Download & Install:
            > ⚠️ **IMPORTANT — Uninstall old version first!** If you have ANY previous version of Acquiro Manager installed, uninstall it completely before installing v2.9.0.
            1. Download `Acquiro-Manager-v2.9.0.apk` below directly onto your device.
            2. Allow "Install from unknown sources" in your device settings if prompted.
            3. Tap the APK file to install.          files: output-apk/Acquiro-Manager-v2.9.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

