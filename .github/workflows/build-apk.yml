name: Build Acquiro Manager React Native APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build React Native Android APK (Android 9+)
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK 34 & Build Tools
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" || true

      - name: Setup Permanent Keystore
        run: |
          if [ -f mobile-app/android/app/acquiro.keystore ]; then
            echo "Using existing permanent acquiro.keystore"
          else
            echo "Generating permanent acquiro.keystore"
            keytool -genkey -v \
              -keystore mobile-app/android/app/acquiro.keystore \
              -alias acquirokey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass acquiro2026 \
              -keypass acquiro2026 \
              -dname "CN=Acquiro Manager,O=Acquiro,C=US"
          fi
          # Always copy as debug.keystore so build.gradle can use a fixed path
          cp mobile-app/android/app/acquiro.keystore mobile-app/android/app/debug.keystore

      - name: Install React Native Dependencies
        run: |
          cd mobile-app
          npm install --legacy-peer-deps

      - name: Bundle React Native JS & Assets
        run: |
          cd mobile-app
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Make Gradlew Executable
        run: chmod +x mobile-app/android/gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Release APK
        run: |
          cd mobile-app/android
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Save Error Log to Branch on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-log
          cp mobile-app/android/gradle-build.log build-error.txt || true
          git add build-error.txt
          git commit -m "ci: android build error log" || true
          git push -u origin debug-log --force || true

      - name: Locate and Prepare Output APK
        run: |
          mkdir -p output-apk
          echo "=== Searching for all APKs in workspace ==="
          find mobile-app/android/app/build/outputs -name "*.apk" -type f || find . -name "*.apk" -type f
          APK_PATH=$(find mobile-app/android/app/build/outputs -name "*release*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find mobile-app/android/app/build/outputs -name "*.apk" -type f | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" -type f | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found anywhere in workspace"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" output-apk/Acquiro-Manager-v2.6.0.apk
          echo "=== APK Ready ==="
          ls -lh output-apk/Acquiro-Manager-v2.6.0.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Acquiro-Manager-v2.6.0-APK
          path: output-apk/Acquiro-Manager-v2.6.0.apk
          retention-days: 90

      - name: Create GitHub Release with React Native APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.6.0-apk
          name: "Acquiro Manager v2.6.0 (Android 9+ Fixed — True Universal Install)"
          body: |
            ### 📱 Acquiro Mobile Manager — React Native v2.6.0

            **Version:** 2.6.0
            **Target Compatibility:** Android 9.0 (API 28) through Android 14+ (API 34/35)
            **Branding:** Official Acquiro Company Geometric "A" Logo
            **Architecture:** `arm64-v8a`, `armeabi-v7a`, `x86`, `x86_64`

            #### 🛠️ What's Fixed in v2.6.0 (Android 9 Install Fix):
            1. **Removed duplicate `packagingOptions {}` block** — v2.5.0 had both `packaging {}` AND `packagingOptions {}` which caused AGP to not apply `useLegacyPackaging=true` correctly; `.so` libs were left DEFLATED (compressed), causing Android 9's package manager to reject the APK.
            2. **Removed `ProfileInstallReceiver`** — `androidx.core:1.13.1` merges a `ProfileInstallReceiver` into the manifest that Android 9 package parser rejects with `INSTALL_PARSE_FAILED_MANIFEST_MALFORMED`. Overridden with `tools:node="remove"`.
            3. **Downgraded androidx dependencies** — `appcompat:1.6.1` and `core:1.12.0` avoid pulling in newer `profileinstaller` transitive dependencies that are not compatible with Android 9.
            4. **Simplified keystore signing config** — Fixed conditional keystore detection that could silently fall back to wrong credentials; now always uses copied `debug.keystore` with consistent `acquirokey` alias.
            5. **All previously fixed features preserved:** Background service, persistent login, no in-app notifications, correct filter chip layout, and Acquiro "A" logo.

            #### 📥 Download & Install:
            > ⚠️ **IMPORTANT — Uninstall old version first!** If you have ANY previous version of Acquiro Manager installed, uninstall it completely before installing v2.6.0. This is required because earlier builds were signed with a different key.
            1. Download `Acquiro-Manager-v2.6.0.apk` below directly onto your device.
            2. Allow "Install from unknown sources" in your device settings if prompted.
            3. Tap the APK file to install.
          files: output-apk/Acquiro-Manager-v2.6.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
