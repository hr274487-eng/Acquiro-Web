name: Build Acquiro Manager React Native APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build React Native Android APK (Android 9+)
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK 34 & Build Tools
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" || true

      - name: Setup Permanent Keystore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f mobile-app/android/app/acquiro.keystore ]; then
            echo "Using existing committed acquiro.keystore"
          else
            echo "Generating and committing permanent acquiro.keystore"
            keytool -genkey -v \
              -keystore mobile-app/android/app/acquiro.keystore \
              -alias acquirokey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 36500 \
              -storepass acquiro2026 \
              -keypass acquiro2026 \
              -dname "CN=Acquiro Manager,O=Acquiro,C=PK"
            git add mobile-app/android/app/acquiro.keystore
            git commit -m "ci: persist permanent signing keystore [skip ci]" || true
            git push || true
          fi
          cp mobile-app/android/app/acquiro.keystore mobile-app/android/app/debug.keystore

      - name: Install React Native Dependencies
        run: |
          cd mobile-app
          npm install --legacy-peer-deps

      - name: Bundle React Native JS & Assets
        run: |
          cd mobile-app
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Make Gradlew Executable
        run: chmod +x mobile-app/android/gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Release APK
        run: |
          cd mobile-app/android
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Save Error Log to Branch on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-log
          cp mobile-app/android/gradle-build.log build-error.txt || true
          git add build-error.txt
          git commit -m "ci: android build error log" || true
          git push -u origin debug-log --force || true

      - name: Locate and Prepare Output APK
        run: |
          mkdir -p output-apk
          echo "=== Searching for all APKs in workspace ==="
          find mobile-app/android/app/build/outputs -name "*.apk" -type f || find . -name "*.apk" -type f
          APK_PATH=$(find mobile-app/android/app/build/outputs -name "*release*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find mobile-app/android/app/build/outputs -name "*.apk" -type f | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" -type f | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found anywhere in workspace"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" output-apk/Acquiro-Manager-v2.16.0.apk
          echo "=== APK Ready ==="
          ls -lh output-apk/Acquiro-Manager-v2.16.0.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Acquiro-Manager-v2.16.0-APK
          path: output-apk/Acquiro-Manager-v2.16.0.apk
          retention-days: 90

      - name: Create GitHub Release with React Native APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.16.0-apk
          name: "Acquiro Manager v2.16.0 — Security, Deletion & Client History"
          body: |
            ### Acquiro Mobile Manager — React Native v2.16.0

            **Version:** 2.16.0
            **Compatibility:** Android 9.0 (API 28) through Android 14+ (API 34/35)
            **Architecture:** arm64-v8a, armeabi-v7a, x86, x86_64

            #### New in v2.16.0:
            - **Security & Password Management:**
              - Dynamic password authentication with SharedPreferences persistence
              - Dedicated Password Change Setup modal in Settings requiring current password, new password, and confirmation
              - Strict password criteria (8+ characters, uppercase letter, digit, special character)
              - Eye icon show/hide toggle on all password fields
              - Master password reset recovery modal on login screen
            - **Order Deletion:**
              - Permanent order deletion button with confirmation dialog, synced live to Supabase cloud
            - **Background Order Monitoring & Silent Service:**
              - Background order polling minimized (`IMPORTANCE_MIN` / `PRIORITY_MIN`) so persistent notification is silent with no top status bar icon
              - Explicit service shutdown on manager logout with sign-out notification
            - **Client History:**
              - Interactive client cards in Clients directory opening full order history
            - **UI Polish & Bug Fixes:**
              - Theme selection (Light/Dark) persists across app reboots
              - Fixed filter chip from "• New" to "New"
              - Updated Supabase schema RLS policies for order status, notes, and deletion

            #### Install Instructions:
            1. Download Acquiro-Manager-v2.16.0.apk below
            2. Allow "Install from unknown sources" if prompted
            3. Tap the APK to install / update
          files: output-apk/Acquiro-Manager-v2.16.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
