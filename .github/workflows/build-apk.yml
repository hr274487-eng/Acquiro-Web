name: Build Acquiro Manager Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK (Android 9+)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Copy & Sync Web Assets to Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Prepare APK
        run: |
          mkdir -p output-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/Acquiro-Manager-v1.0.apk
          echo "APK successfully built:"
          ls -lh output-apk/Acquiro-Manager-v1.0.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Acquiro-Manager-v1.0-APK
          path: output-apk/Acquiro-Manager-v1.0.apk
          retention-days: 90

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-apk
          name: "Acquiro Manager v1.0.0 (Android APK)"
          body: |
            ### 📱 Acquiro Mobile Manager - Installable Android APK
            **Version:** 1.0.0
            **Compatibility:** Android 9.0+ (API Level 28 to 36)
            
            #### 🚀 Highlights & Features:
            - **Realtime Order Reception:** Live cloud sync with Supabase `orders` table.
            - **Modern Tech Ping Sound:** Web Audio harmonic chime + rhythmic haptic vibration alert on incoming customer orders.
            - **Order Triage:** 1-tap accept, progress, complete, cancel, instant phone dialer (`tel:`), email compose (`mailto:`), and internal manager notes.
            - **Category Filters & Search:** Filter by status or category, instant fuzzy search by name/phone/company/ref.
            - **Customer Directory & Export:** 1-tap export of customer and order records to **Excel (`.xlsx`)** and **CSV (`.csv`)**.
            - **Customizable Settings:** Light/Dark theme toggle (matches website styling), Supabase credentials tester, notification & vibration toggles, sound preview, and manager password management.
            
            #### 📥 Download & Install:
            1. Download `Acquiro-Manager-v1.0.apk` below directly onto your Android device.
            2. Open the file and tap **Install** (allow *Install from Unknown Sources* if prompted).
            3. Default Manager Credentials:
               - **Username:** `admin`
               - **Password:** `acquiro2026`
          files: output-apk/Acquiro-Manager-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
