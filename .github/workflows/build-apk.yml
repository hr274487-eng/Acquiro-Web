name: Build Acquiro Manager React Native APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build React Native Android APK (Android 9+)
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK 34 & Build Tools
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" || true

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v \
            -keystore mobile-app/android/app/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Install React Native Dependencies
        run: |
          cd mobile-app
          npm install --legacy-peer-deps

      - name: Bundle React Native JS & Assets
        run: |
          cd mobile-app
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Make Gradlew Executable
        run: chmod +x mobile-app/android/gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Release APK
        run: |
          cd mobile-app/android
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Save Error Log to Branch on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-log
          cp mobile-app/android/gradle-build.log build-error.txt || true
          git add build-error.txt
          git commit -m "ci: android build error log" || true
          git push -u origin debug-log --force || true

      - name: Locate and Prepare Output APK
        run: |
          mkdir -p output-apk
          echo "=== Searching for all APKs in workspace ==="
          find mobile-app/android/app/build/outputs -name "*.apk" -type f || find . -name "*.apk" -type f
          APK_PATH=$(find mobile-app/android/app/build/outputs -name "*release*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find mobile-app/android/app/build/outputs -name "*.apk" -type f | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" -type f | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found anywhere in workspace"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" output-apk/Acquiro-Manager-v2.2.0.apk
          echo "=== APK Ready ==="
          ls -lh output-apk/Acquiro-Manager-v2.2.0.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Acquiro-Manager-v2.2.0-APK
          path: output-apk/Acquiro-Manager-v2.2.0.apk
          retention-days: 90

      - name: Create GitHub Release with React Native APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.2.0-apk
          name: "Acquiro Manager v2.2.0 (Hermes C++ Engine & Standalone Production)"
          body: |
            ### 📱 Acquiro Mobile Manager — React Native v2.2.0 (Production Standalone)

            **Version:** 2.2.0 (Fully Linked Hermes Release)
            **Target Compatibility:** Android 9.0 (API 28) through Android 14+ (API 34/35)
            **Branding:** Official Acquiro Company Geometric "A" Logo
            **Architecture:** `arm64-v8a`, `armeabi-v7a`, `x86`, `x86_64`

            #### 🛠️ Root Causes Resolved:
            1. **Missing Hermes Native Shared Library (`libhermes.so`):** In previous build, `hermesEnabled=true` was set, but `com.facebook.react:hermes-android` was omitted from Gradle dependencies, causing `UnsatisfiedLinkError: couldn't find DSO to load: libhermes.so` on launch. Added `hermes-android` dependency.
            2. **Native Runtime Delegate Alignment:** Wired `DefaultReactNativeHost` and `DefaultReactActivityDelegate` with `isHermesEnabled() = true` and `isNewArchEnabled() = false` to guarantee standard JavaScriptExecutor initialization.
            3. **Safe Dynamic Modules:** Guarded optional modules in `exportService.js` to ensure zero module evaluation exceptions at startup.
            4. **Dual Signature & Legacy Packaging for Android 9:** Embedded APK Signature Scheme v1 alongside v2, with `android:extractNativeLibs="true"` and `useLegacyPackaging = true`.
            5. **Official Acquiro "A" Logo:** Rendered across all launcher mipmap densities (`mdpi`, `hdpi`, `xhdpi`, `xxhdpi`, `xxxhdpi`) and adaptive vector foreground drawable.

            #### 🔑 Default Manager Credentials:
            - **Username:** `admin`
            - **Password:** `acquiro2026`

            #### 📥 Download & Install:
            1. Download `Acquiro-Manager-v2.2.0.apk` below directly onto your device.
            2. Tap the file to install (allow *Install from Unknown Sources* if prompted).
            3. Log in with `admin` / `acquiro2026`.
          files: output-apk/Acquiro-Manager-v2.2.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
