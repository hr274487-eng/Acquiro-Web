<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B00CF"/>
      <stop offset="45%" stop-color="#300A6E"/>
      <stop offset="75%" stop-color="#C10A28"/>
      <stop offset="100%" stop-color="#FF2D2B"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D2B"/>
      <stop offset="100%" stop-color="#0B00CF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background polygon -->
  <rect width="100" height="100" rx="24" fill="#06030F"/>
  <rect x="1" y="1" width="98" height="98" rx="23" stroke="url(#strokeGrad)" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Stylized Geometric "A" with chevron apex -->
  <g filter="url(#glow)">
    <path d="M50 18L78 78H62L50 48L38 78H22L50 18Z" fill="url(#primaryGrad)"/>
    <polygon points="50,34 60,60 40,60" fill="#06030F"/>
    <circle cx="50" cy="56" r="4" fill="#FF2D2B"/>
    <path d="M34 66H66" stroke="#FF2D2B" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
