apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

react {
    root = file("../..")
    reactNativeDir = file("../../node_modules/react-native")
    codegenDir = file("../../node_modules/@react-native/codegen")
    cliFile = file("../../node_modules/react-native/cli.js")
}

android {
    namespace "com.acquiro.manager"
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        applicationId "com.acquiro.manager"
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 10
        versionName "2.9.0"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    signingConfigs {
        release {
            storeFile file('debug.keystore')
            storePassword 'acquiro2026'
            keyAlias 'acquirokey'
            keyPassword 'acquiro2026'
            v1SigningEnabled true
            v2SigningEnabled true
        }
        debug {
            storeFile file('debug.keystore')
            storePassword 'acquiro2026'
            keyAlias 'acquirokey'
            keyPassword 'acquiro2026'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

// Force useLegacyPackaging=true via the AGP new variant API (AndroidComponentsExtension).
// This runs after AGP finalizeDsl — overriding the AGP 8.3 auto-default that ignores
// our DSL setting when minSdkVersion >= 23.
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.packaging.jniLibs.useLegacyPackaging.set(true)
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("androidx.core:core:1.12.0")
}
